version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: curator_db
    environment:
      POSTGRES_USER: curator_admin
      POSTGRES_PASSWORD: curator_pass
      POSTGRES_DB: curator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: